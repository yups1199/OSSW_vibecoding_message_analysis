name: CD - Local Windows Blue-Green deployment

on:
  workflow_run:
    workflows: ['CI - Test and publish Docker image']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: kakao-local-windows-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy successful main CI to local Docker Desktop
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      DEPLOY_REPOSITORY: ${{ github.repository }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kakao-chat-analyzer

    steps:
      - name: Reject stale CI before checking out deployment code
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CI_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid CI SHA' }
          $headers = @{Authorization="Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}
          $branch = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:DEPLOY_REPOSITORY/branches/main" -Headers $headers -TimeoutSec 20
          $deploy = if ($branch.commit.sha -eq $env:CI_SHA) { 'true' } else { 'false' }
          "deploy=$deploy" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($deploy -eq 'false') { Write-Host 'SKIP: CI commit is no longer the main head' }

      - name: Checkout the original successful CI commit
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify local Linux Docker engine access
        if: steps.guard.outputs.deploy == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $os = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os -ne 'linux') { throw 'Runner cannot access Docker Desktop Linux engine' }
          # Preserve the engine endpoint before isolating registry credentials.
          # A fresh DOCKER_CONFIG has no Docker Desktop context metadata.
          $endpoint = $env:DOCKER_HOST
          if ($env:DOCKER_CONTEXT) {
            $endpoint = docker context inspect $env:DOCKER_CONTEXT --format '{{.Endpoints.docker.Host}}'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve selected Docker context' }
          } elseif (-not $endpoint) {
            $endpoint = docker context inspect --format '{{.Endpoints.docker.Host}}'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Docker Desktop endpoint' }
          }
          if ($endpoint -notmatch '^npipe://') { throw 'Expected a local Docker Desktop named-pipe endpoint' }
          "DOCKER_HOST=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'DOCKER_CONTEXT=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Log in to Docker Hub with temporary credentials
        if: steps.guard.outputs.deploy == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DOCKERHUB_USERNAME -or -not $env:DOCKERHUB_TOKEN) { throw 'Required Docker Hub secrets are missing' }
          $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP "kakao-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $env:DOCKER_CONFIG | Out-Null
          "DOCKER_CONFIG=$env:DOCKER_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Docker Hub login failed; deployment not started' }

      - name: Prepare, validate, switch, stabilize and drain
        if: steps.guard.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\deploy\Deploy.ps1 -Repository $env:DEPLOY_REPOSITORY -CommitSha $env:CI_SHA -CiRunId ([long]$env:CI_RUN_ID) -CiRunNumber ([long]$env:CI_RUN_NUMBER) -ImageName $env:IMAGE_NAME

      - name: Deployment failure diagnostics
        if: failure()
        run: |
          docker ps -a --filter "label=io.kakao.deploy.repository=$env:DEPLOY_REPOSITORY"
          $owned = @(docker ps -a --filter "label=io.kakao.deploy.repository=$env:DEPLOY_REPOSITORY" --format '{{.Names}}')
          foreach ($name in ($owned | Where-Object { $_ -in @('kakao-chat-proxy','kakao-chat-blue','kakao-chat-green') })) {
            docker inspect --format '{{json .State}}' $name
            docker logs --tail 100 $name
          }
          # Preserve the job's original failure; diagnostic targets may not exist.
          exit 0

      - name: Remove only this job's temporary Docker credentials
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\','/') + [IO.Path]::DirectorySeparatorChar
          $target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "kakao-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
          if (-not $target.StartsWith($root,[StringComparison]::OrdinalIgnoreCase) -or (Split-Path -Leaf $target) -ne "kakao-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") { throw 'Unsafe temporary credential cleanup path' }
          if (Test-Path -LiteralPath $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
