name: CI - Test and publish Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    name: Test, build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_VERSION: sha-${{ github.sha }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kakao-chat-analyzer
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Test parser and API with synthetic data
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image for verification (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: kakao-chat-analyzer:ci
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container on loopback
        run: docker run -d --name kakao-ci -p 127.0.0.1:8000:8000 kakao-chat-analyzer:ci

      - name: Verify container health, version and analysis API
        run: |
          python tests/smoke.py http://127.0.0.1:8000 "$APP_VERSION"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kakao-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          echo "Docker HEALTHCHECK did not become healthy"
          exit 1

      - name: Show container diagnostics on failure
        if: failure()
        run: docker logs kakao-ci || true

      - name: Remove CI test container
        if: always()
        run: docker rm -f kakao-ci || true

      - name: Log in to Docker Hub after successful verification
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image with immutable-reference and latest tags
        run: |
          docker tag kakao-chat-analyzer:ci "$IMAGE_NAME:$APP_VERSION"
          docker tag kakao-chat-analyzer:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$APP_VERSION"
          docker push "$IMAGE_NAME:latest"
